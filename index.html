<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>КАТЭК AR Экспонат</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; }
        /* Простейший индикатор загрузки, пока камера инициализируется */
        #scanning-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); color: white; display: flex;
            align-items: center; justify-content: center; font-family: sans-serif;
            z-index: 9999; pointer-events: none;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="scanning-overlay">Запуск камеры и загрузка AR-сцены...</div>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind; filterMinCF:0.001; filterBeta: 0.01;" 
             color-space="sRGB" 
             renderer="colorManagement: true, physicallyCorrectLights: true" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <a-asset-item id="katekModel" src="./model.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-gltf-model src="#katekModel" 
                          position="0 0 0" 
                          rotation="90 0 0" 
                          scale="0.5 0.5 0.5">
            </a-gltf-model>
        </a-entity>
        
    </a-scene>

    <script>
        // Скрываем оверлей загрузки, когда AR готова к работе
        const sceneEl = document.querySelector('a-scene');
        const overlay = document.getElementById('scanning-overlay');
        sceneEl.addEventListener("arReady", () => {
            overlay.classList.add('hidden');
        });
    </script>
</body>
</html>
