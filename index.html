<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест 3D модели КАТЭК</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.2.0/dist/aframe-extras.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; }
    </style>
</head>
<body>

    <a-scene color-space="sRGB" renderer="colorManagement: true; physicallyCorrectLights: true;">
        
        <a-assets>
            <a-asset-item id="katekModel" src="./model.glb"></a-asset-item>
        </a-assets>

        <a-entity camera look-controls orbit-controls="target: 0 0 0; minDistance: 1; maxDistance: 20; initialPosition: 0 2 5"></a-entity>

        <a-entity light="type: ambient; color: #ffffff; intensity: 0.6"></a-entity>
        <a-entity light="type: directional; color: #ffffff; intensity: 0.8" position="1 4 3"></a-entity>
        <a-entity light="type: directional; color: #ffffff; intensity: 0.5" position="-2 2 -3"></a-entity>

        <a-entity id="modelContainer" position="0 0 0">
            <a-gltf-model src="#katekModel" scale="1 1 1"></a-gltf-model>
        </a-entity>

    </a-scene>

</body>
</html>
